<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#161b16">
  <title>秦直道远征录 · 10日自驾与任务公会</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            ink: '#161b16', paper: '#f4efe3', bronze: '#a86f32', moss: '#526044', cinnabar: '#b94b35'
          },
          fontFamily: { serif: ['Noto Serif SC', 'STSong', 'serif'], sans: ['Inter', 'PingFang SC', 'sans-serif'] },
          boxShadow: { seal: '0 16px 50px rgba(42, 35, 25, .14)' }
        }
      }
    }
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@500;600;700;900&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/remixicon@4.6.0/fonts/remixicon.css" rel="stylesheet">
</head>
<body class="min-h-screen bg-paper font-sans text-ink selection:bg-cinnabar selection:text-white">
  <div class="fixed inset-x-0 top-0 z-50 border-b border-white/10 bg-ink/90 text-stone-100 backdrop-blur-xl">
    <header class="mx-auto flex h-16 max-w-[1600px] items-center justify-between px-4 md:px-8">
      <button class="flex items-center gap-3" data-nav="itinerary" aria-label="返回行程首页">
        <span class="grid h-9 w-9 place-items-center rounded-full border border-amber-200/30 bg-bronze text-lg font-bold text-white">秦</span>
        <span class="text-left">
          <strong class="block font-serif text-base tracking-[.18em]">秦直道远征录</strong>
          <small class="hidden text-[10px] tracking-[.22em] text-stone-400 sm:block">THE QIN IMPERIAL ROAD</small>
        </span>
      </button>
      <nav class="flex items-center rounded-full border border-white/10 bg-white/5 p-1 text-sm">
        <button class="nav-btn rounded-full px-4 py-2 transition" data-nav="itinerary"><i class="ri-route-line mr-1"></i>十日行程</button>
        <button class="nav-btn rounded-full px-4 py-2 transition" data-nav="guild"><i class="ri-sword-line mr-1"></i>任务公会</button>
      </nav>
      <div class="hidden items-center gap-2 text-xs text-stone-300 lg:flex"><i class="ri-calendar-event-line text-amber-400"></i>9.27 — 10.06</div>
    </header>
  </div>

  <main id="app" class="min-h-screen pt-16" aria-live="polite"></main>

  <footer class="border-t border-stone-300 bg-[#ebe3d4] px-4 py-8 text-center text-sm text-stone-600">
    <p class="mb-2 font-serif tracking-widest">关中 · 陇东 · 陕北 · 河套</p>
    <p>由 AI 通过自然语言生成</p>
  </footer>

  <div id="toast" class="pointer-events-none fixed bottom-6 left-1/2 z-[80] -translate-x-1/2 translate-y-6 rounded-full bg-ink px-5 py-3 text-sm text-white opacity-0 shadow-2xl transition-all duration-300"></div>
  <script type="module" src="./main.js"></script>
</body>
</html>
